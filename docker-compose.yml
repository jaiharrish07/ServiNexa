services:
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped
